# =============================================================================
# Football Game Configuration
# =============================================================================
# Usage:
#   python main.py \
#     --game-config config/games/football_v1.yaml \
#     --match-id test_123 \
#     --source /path/to/video.mp4 \
#     --local
# =============================================================================

game_id: "football_v1"
game_name: "Football"

# =============================================================================
# MODELS
# =============================================================================
models:
  - model_id: "yolo_football"
    model_name: "YOLO Football Detector"
    model_type: "object_detection"
    model_architecture: "yolov8"

    # Path or URL to model file
    # Use "yolov8n.pt" for testing (downloads automatically)
    model_url: "yolov8n.pt"

    # Classes to detect - just use simple names!
    # System automatically maps "ball" -> model's "sports ball" (class 32)
    # Empty list = detect all classes
    classes_to_detect:
      - ball
      - person

    # Inference parameters
    default_params:
      confidence_threshold: 0.5
      half_precision: false

# =============================================================================
# MODEL ASSIGNMENTS
# =============================================================================
model_assignments:
  - model_id: "yolo_football"
    role: "default"

# =============================================================================
# SERVICES
# =============================================================================
services:
  - service_type: "object_detection"
    enabled: true
    model_roles:
      - default
    db_table_name: "inference_results"
    db_batch_size: 12

# =============================================================================
# INFERENCE SETTINGS
# =============================================================================
inference_settings:
  target_fps: 30
  frame_skip: 1
  processing_resolution:
    - 1280
    - 720
