# =============================================================================
# Football Game Configuration
# =============================================================================
# Usage:
#   python main.py \
#     --game-config config/games/football_v1.yaml \
#     --match-id test_123 \
#     --source /path/to/video.mp4 \
#     --local
# =============================================================================

game_id: "football_v1"
game_name: "Football"

# =============================================================================
# MODELS
# =============================================================================
models:
  - model_id: "yolo_football"
    model_name: "YOLO Football Detector"
    model_type: "object_detection"
    model_architecture: "yolov8"

    # Local path to model file
    model_path: "/Users/spectatr/Downloads/best_263_nano_1920_bph_v3.pt"

    # Classes to detect - just use simple names!
    # This model has: Ball, Person, Head
    classes_to_detect:
      - ball

    # Inference parameters
    default_params:
      confidence_threshold: 0.3
      half_precision: false

# =============================================================================
# DEFAULTS (Global settings - can be overridden per service)
# =============================================================================
defaults:
  inference:
    frame_skip: 1
    processing_resolution: [1280, 720]
  output:
    db_table_name: "inference_results"
    db_batch_size: 12
    db_flush_interval_ms: 250

# =============================================================================
# SERVICES
# =============================================================================
services:
  - service_type: "object_detection"
    enabled: true
    model_id: "yolo_football"
    device: "cpu"
    # No overrides = uses all defaults
