# =============================================================================
# NEW GAME CONFIGURATION TEMPLATE
# =============================================================================
#
# To add a new sport/game:
# 1. Copy this file and rename (e.g., volleyball_config.yaml)
# 2. Update game_id, game_name, game_category
# 3. Add your models (YOLO, custom, etc.)
# 4. Configure services (OD, camera view, etc.)
# 5. Test with: python -m config.loader config/examples/your_config.yaml
#
# That's it! No code changes needed for standard YOLO models.
# =============================================================================

# -----------------------------------------------------------------------------
# GAME IDENTIFICATION
# -----------------------------------------------------------------------------
game_id: "your_game_id_here"           # MongoDB ObjectId or unique string
game_name: "YourSportName"             # Human-readable name
game_category: "ball_sport"            # ball_sport, racket_sport, combat_sport, athletics, other

# -----------------------------------------------------------------------------
# MODELS
# -----------------------------------------------------------------------------
# Each model runs independently and can use different GPUs.
# Supports: yolov8, yolov11, yolov12, rf_detr, custom
models:
  # Example 1: Simple single-model setup
  - model_id: "your_game_od_v1"        # Unique identifier
    model_type: "object_detection"     # object_detection, segmentation, pose_estimation
    model_architecture: "yolov8"       # yolov8, yolov11, yolov12, rf_detr, custom
    model_url: "s3://your-bucket/models/your_game/od_v1.pt"
    version: "1.0.0"

    # Which model classes to detect (model's native class IDs)
    classes_to_predict: [0, 1, 2]

    # Map model class IDs to universal class names
    # Universal classes: PERSON, BALL, GOAL, HEAD, etc. (see config/class_registry.py)
    class_mapping:
      - model_class_id: 0
        universal_class_name: "PERSON"
      - model_class_id: 1
        universal_class_name: "BALL"
      - model_class_id: 2
        universal_class_name: "GOAL"

    # Inference parameters
    params:
      confidence_threshold: 0.5
      iou_threshold: 0.45
      batch_size: 1
      half_precision: false          # Set true for faster GPU inference

  # Example 2: Second model (optional, for multi-model setups like Cricket)
  # - model_id: "your_game_secondary_v1"
  #   model_type: "object_detection"
  #   model_architecture: "yolov8"
  #   model_url: "s3://your-bucket/models/your_game/secondary_v1.pt"
  #   classes_to_predict: [0]
  #   class_mapping:
  #     - model_class_id: 0
  #       universal_class_name: "HEAD"
  #   params:
  #     confidence_threshold: 0.4

# -----------------------------------------------------------------------------
# SERVICES
# -----------------------------------------------------------------------------
# Each service is an independent process with its own frame provider.
services:
  # Object Detection Service
  - service_type: "object_detection"
    enabled: true
    device: "cuda:0"                   # cpu, cuda:0, cuda:1, etc.
    params:
      model_ids:                       # Which models to run in this service
        - "your_game_od_v1"
        # - "your_game_secondary_v1"   # Add more models here

  # Camera View Detection (optional but recommended)
  - service_type: "camera_view"
    enabled: true
    device: "cpu"                      # Camera view runs fine on CPU
    params:
      phash_threshold: 20              # Higher = less sensitive
      histogram_threshold: 0.90        # Lower = less sensitive
      min_frame_gap: 25                # Minimum frames between cuts

  # Future services (currently placeholders)
  # - service_type: "replay_detection"
  #   enabled: false
  #   device: "cpu"

# -----------------------------------------------------------------------------
# INFERENCE SETTINGS
# -----------------------------------------------------------------------------
inference_settings:
  target_fps: 25                       # Frame extraction target FPS
  frame_skip: 1                        # 1 = all frames, 2 = every other frame
  processing_resolution: [1280, 720]   # Width, Height for processing
  db_write_batch_size: 12              # Batch size for DynamoDB writes
  db_write_interval_ms: 250            # Max interval between DB writes

# -----------------------------------------------------------------------------
# METADATA
# -----------------------------------------------------------------------------
config_version: 1
