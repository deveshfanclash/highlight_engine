# =============================================================================
# TEST CONFIGURATION - Multiple OD models + Camera View
# =============================================================================

# =============================================================================
# MODELS
# =============================================================================
models:
  # Model 1: Default YOLO for Person detection
  - model_id: yolo_person
    model_name: YOLO Person Detection
    model_type: object_detection
    model_architecture: yolov8
    model_url: ./yolov8n.pt
    version: "latest"
    classes_to_predict: [0]
    class_mapping:
      - model_class_id: 0
        universal_class_name: PERSON
    params:
      confidence_threshold: 0.4
      iou_threshold: 0.45
      max_detections: 100
    preferred_device: cpu

  # Model 2: Custom BPH v3 model
  - model_id: bph_v3
    model_name: BPH v3 Custom Model
    model_type: object_detection
    model_architecture: yolov8
    model_url: /Users/spectatr/Downloads/best_263_nano_1920_bph_v3.pt
    version: "v3"
    classes_to_predict: []
    class_mapping: []
    params:
      confidence_threshold: 0.4
      iou_threshold: 0.45
      max_detections: 100
    preferred_device: cpu

# =============================================================================
# GAME CONFIG
# =============================================================================
game_id: "test_game_001"
game_name: Test Game
game_category: ball_sport
config_version: 1

model_ids:
  - yolo_person
  - bph_v3

# =============================================================================
# SERVICES (fields at top level, not nested under params)
# =============================================================================
services:
  # OD Service 1: Person detection (default YOLO)
  - service_type: object_detection
    enabled: true
    device: cpu
    model_ids:
      - yolo_person
    frame_skip: 1

  # OD Service 2: Custom BPH model
  - service_type: object_detection
    enabled: true
    device: cpu
    model_ids:
      - bph_v3
    frame_skip: 1

  # Camera View Service
  - service_type: camera_view
    enabled: true
    device: cpu
    phash_threshold: 20
    histogram_threshold: 0.90
    min_frame_gap: 25
    resolution_scale: 0.5

  # HLS Metadata Service
  - service_type: hls_metadata
    enabled: true
    device: cpu
    poll_interval_seconds: 5
    timeout_no_segment_seconds: 60

# =============================================================================
# INFERENCE SETTINGS
# =============================================================================
inference_settings:
  target_fps: 25
  frame_skip: 1
  processing_resolution: [1280, 720]
  stream_buffer_size: 30
