# =============================================================================
# CRICKET GAME CONFIGURATION
# =============================================================================
# This config is stored in MongoDB collection: game_configs
# Multi-model setup: 3 models running on separate GPUs
# =============================================================================

game_id: "68b7fd9f414719f5a368fae0"
game_name: "Cricket"
game_category: "ball_sport"

# -----------------------------------------------------------------------------
# MODELS
# -----------------------------------------------------------------------------
# Cricket uses 3 separate models for comprehensive detection
models:
  # -------------------------
  # Model 1: Cricket-specific detection (batsman, bowler, wicket, etc.)
  # -------------------------
  - model_id: "cricket_od_v1"
    model_type: "object_detection"
    model_architecture: "yolov8"
    model_url: "s3://spectatr-models/cricket/cricket_od/latest.pt"
    version: "latest"

    classes_to_predict: [0, 1, 2, 3, 4]

    class_mapping:
      - model_class_id: 0
        universal_class_name: "BATSMAN"
      - model_class_id: 1
        universal_class_name: "BOWLER"
      - model_class_id: 2
        universal_class_name: "BALL"
      - model_class_id: 3
        universal_class_name: "WICKET"
      - model_class_id: 4
        universal_class_name: "FIELDER"

    params:
      confidence_threshold: 0.5
      iou_threshold: 0.45
      max_detections: 50
      batch_size: 1  # Lower batch for multi-model to save GPU memory
      half_precision: true

    output_format: "bbox"
    preferred_device: "gpu"

  # -------------------------
  # Model 2: Person + Head detection
  # -------------------------
  - model_id: "cricket_person_head_v1"
    model_type: "object_detection"
    model_architecture: "yolov8"
    model_url: "s3://spectatr-models/cricket/person_head/latest.pt"
    version: "latest"

    classes_to_predict: [0, 1]

    class_mapping:
      - model_class_id: 0
        universal_class_name: "PERSON"
      - model_class_id: 1
        universal_class_name: "HEAD"

    params:
      confidence_threshold: 0.4
      iou_threshold: 0.5
      max_detections: 100
      batch_size: 1

    output_format: "bbox"
    preferred_device: "gpu"

  # -------------------------
  # Model 3: Generic person detection (YOLO default for fallback)
  # -------------------------
  - model_id: "cricket_person_generic_v1"
    model_type: "object_detection"
    model_architecture: "yolov8"
    model_url: "s3://spectatr-models/default/yolov8n.pt"
    version: "latest"

    # Only predict person class from COCO (class 0)
    classes_to_predict: [0]

    class_mapping:
      - model_class_id: 0
        universal_class_name: "PERSON"

    params:
      confidence_threshold: 0.5
      iou_threshold: 0.45
      max_detections: 100
      batch_size: 1

    output_format: "bbox"
    preferred_device: "gpu"

# -----------------------------------------------------------------------------
# SERVICES
# -----------------------------------------------------------------------------
# Each model runs as a SEPARATE service on a SEPARATE GPU
# This allows independent scaling and avoids synchronization complexity
services:
  # Service 1: Cricket-specific OD on GPU 0
  - service_type: "object_detection"
    enabled: true
    device: "cuda:0"
    params:
      model_ids: ["cricket_od_v1"]

  # Service 2: Person+Head OD on GPU 1
  - service_type: "object_detection"
    enabled: true
    device: "cuda:1"
    params:
      model_ids: ["cricket_person_head_v1"]

  # Service 3: Generic Person OD on GPU 2
  - service_type: "object_detection"
    enabled: true
    device: "cuda:2"
    params:
      model_ids: ["cricket_person_generic_v1"]

  # Service 4: Camera View Detection on CPU
  - service_type: "camera_view"
    enabled: true
    device: "cpu"
    params:
      phash_threshold: 20
      histogram_threshold: 0.90
      min_frame_gap: 25
      resolution_scale: 0.5

# -----------------------------------------------------------------------------
# INFERENCE SETTINGS
# -----------------------------------------------------------------------------
inference_settings:
  target_fps: 25
  frame_skip: 1
  processing_resolution: [1920, 1080]  # Higher resolution for cricket
  stream_buffer_size: 30
  db_write_batch_size: 12
  db_write_interval_ms: 250

# Metadata
config_version: 1
