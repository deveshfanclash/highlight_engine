# =============================================================================
# GAME TEMPLATE: FOOTBALL (Tier 2)
# =============================================================================
# Defines WHAT to do for Football inference - the logic, not the infrastructure.
# NO device/instance information - that's in DeploymentProfile (Tier 3).
# =============================================================================

game_id: football_v1
game_name: Football
game_category: ball_sport
description: Standard football/soccer match inference template

# =============================================================================
# MODEL ASSIGNMENTS
# =============================================================================
# How models from the registry (Tier 1) are used in this game.
# Models are referenced by ID - actual model configs loaded from registry.
# =============================================================================
model_assignments:
  # Primary object detection model
  - model_id: football_od_v2
    role: primary_od
    priority: 10
    class_filter: [0, 1, 2]  # PERSON, BALL, GOAL
    params_override:
      confidence_threshold: 0.5
      iou_threshold: 0.45

  # Ball-specific detector (higher confidence, runs in parallel)
  - model_id: ball_detector_v1
    role: ball_detector
    priority: 5
    class_filter: [1]  # Only BALL class
    params_override:
      confidence_threshold: 0.7
      max_detections: 5

  # Field segmentation model
  - model_id: field_segmentation_v1
    role: segmentation
    priority: 3
    params_override:
      output_type: mask

# =============================================================================
# SERVICE TEMPLATES
# =============================================================================
# Define WHAT services run, not WHERE they run.
# Instance assignments come from DeploymentProfile (Tier 3).
# =============================================================================
services:
  # Primary Object Detection Service
  - service_type: object_detection
    enabled: true
    model_roles:
      - primary_od
      - ball_detector
    frame_skip: 1
    target_width: 1280
    target_height: 720
    db_table_name: inference_results
    db_batch_size: 12
    db_flush_interval_ms: 250

  # Field Segmentation Service
  - service_type: segmentation
    enabled: true
    model_roles:
      - segmentation
    frame_skip: 5  # Every 5th frame for segmentation
    target_width: 640
    target_height: 360
    save_masks_to_s3: true
    mask_format: npz
    db_table_name: segmentation_results
    db_batch_size: 4

  # Camera View Detection Service
  - service_type: camera_view
    enabled: true
    phash_threshold: 20
    histogram_threshold: 0.90
    min_frame_gap: 25
    resolution_scale: 0.5
    frame_skip: 3
    db_table_name: camera_view_results

  # HLS Metadata Service
  - service_type: hls_metadata
    enabled: true
    poll_interval_seconds: 5
    timeout_no_segment_seconds: 60
    resolution_preference: "_480p.m3u8"

# =============================================================================
# INFERENCE SETTINGS
# =============================================================================
# Global defaults - can be overridden per-service or per-match.
# =============================================================================
inference_settings:
  target_fps: 25
  frame_skip: 1
  processing_resolution: [1280, 720]
  stream_buffer_size: 30
  enable_frame_interpolation: false
  max_frame_lag_ms: 1000

# =============================================================================
# UNIVERSAL CLASS DEFINITIONS
# =============================================================================
# Game-specific interpretation of universal classes.
# Football splits PERSON into more specific roles.
# =============================================================================
universal_class_definitions:
  PERSON:
    subtypes:
      - PLAYER
      - REFEREE
      - GOALKEEPER
    detection_priority: high
  BALL:
    subtypes:
      - FOOTBALL
    detection_priority: critical
  GOAL:
    subtypes:
      - GOAL_POST
      - NET
    detection_priority: medium

# =============================================================================
# METADATA
# =============================================================================
config_version: 2
tags:
  - football
  - soccer
  - ball_sport
  - team_sport
