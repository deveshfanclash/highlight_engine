# =============================================================================
# FOOTBALL GAME CONFIGURATION
# =============================================================================
# This config is stored in MongoDB collection: game_configs
# Single model, standard setup for football matches
# =============================================================================

game_id: "6622504e845d0e572cddc306"
game_name: "Football"
game_category: "ball_sport"

# -----------------------------------------------------------------------------
# MODELS
# -----------------------------------------------------------------------------
# Football uses a single object detection model
models:
  - model_id: "football_od_v2"
    model_type: "object_detection"
    model_architecture: "yolov8"
    model_url: "s3://spectatr-models/football/6622504e845d0e572cddc306/latest.pt"
    version: "latest"

    # Classes this model should predict (model's native class IDs)
    classes_to_predict: [0, 1, 2]

    # Mapping from model's class IDs to universal class names
    class_mapping:
      - model_class_id: 0
        universal_class_name: "PERSON"
      - model_class_id: 1
        universal_class_name: "BALL"
      - model_class_id: 2
        universal_class_name: "GOAL"

    # Model inference parameters
    params:
      confidence_threshold: 0.5
      iou_threshold: 0.45
      max_detections: 100
      batch_size: 4
      half_precision: false

    output_format: "bbox"
    preferred_device: "gpu"

# -----------------------------------------------------------------------------
# SERVICES
# -----------------------------------------------------------------------------
# What services to run for this game
services:
  # Object Detection Service
  - service_type: "object_detection"
    enabled: true
    device: "cuda:0"
    params:
      model_ids: ["football_od_v2"]

  # Camera View Detection Service
  - service_type: "camera_view"
    enabled: true
    device: "cpu"
    params:
      phash_threshold: 20
      histogram_threshold: 0.90
      min_frame_gap: 25
      resolution_scale: 0.5

# -----------------------------------------------------------------------------
# INFERENCE SETTINGS
# -----------------------------------------------------------------------------
inference_settings:
  target_fps: 25
  frame_skip: 1
  processing_resolution: [1280, 720]
  stream_buffer_size: 30
  db_write_batch_size: 12
  db_write_interval_ms: 250

# Metadata
config_version: 1
