# =============================================================================
# DEVELOPMENT DEPLOYMENT PROFILE (Tier 3)
# =============================================================================
# Local/development deployment - single machine, no GPU queue separation.
# Suitable for testing and development.
# =============================================================================

profile_id: development
profile_name: Development
description: Local development deployment for testing
environment: development

# =============================================================================
# INSTANCE ASSIGNMENTS
# =============================================================================
# In development, everything runs on a single local queue.
# No GPU/CPU separation - assumes local machine with optional GPU.
# =============================================================================
instance_assignments:
  # All services use the same local queue in development
  - service_pattern: "*"
    queue: local-dev-queue
    instance_type: local
    vcpus: 4
    memory_mb: 8192
    gpu_count: 1
    priority: 0

# =============================================================================
# AWS BATCH CONFIGURATION
# =============================================================================
# Minimal batch config for development.
# =============================================================================
batch:
  default_cpu_queue: local-dev-queue
  default_gpu_queue: local-dev-queue

  queues:
    - queue_name: local-dev-queue
      compute_environment: local-dev-env
      priority: 1
      is_gpu: true

  job_definitions:
    hls_metadata: local-hls-service
    camera_view: local-cv-service
    object_detection: local-od-service
    segmentation: local-seg-service

# =============================================================================
# SCALING CONFIGURATION
# =============================================================================
# No scaling in development - fixed resources.
# =============================================================================
scaling:
  min_vcpus: 0
  max_vcpus: 8
  desired_vcpus: 4
  use_spot_instances: false
  spot_bid_percentage: 100
  scale_down_delay_seconds: 0

# =============================================================================
# MONITORING CONFIGURATION
# =============================================================================
# Relaxed monitoring for development.
# =============================================================================
monitoring:
  heartbeat_timeout_seconds: 600
  job_timeout_minutes: 60
  max_retries: 1
  retry_delay_seconds: 5
  enable_alerts: false
  alert_on_failure: false
  alert_on_stuck: false
  enable_cloudwatch_metrics: false
  metrics_namespace: Inference/Dev

# =============================================================================
# COST CONTROLS
# =============================================================================
# Minimal limits for development.
# =============================================================================
cost_controls:
  max_concurrent_matches: 2
  max_concurrent_jobs_per_match: 4
  prefer_spot_instances: false
  allowed_instance_families:
    - local

# =============================================================================
# DATABASE CONFIGURATION
# =============================================================================
database:
  inference_results_table: dev_inference_results
  jobs_tracking_table: dev_inference_jobs
  metadata_table: dev_video_frames_metadata
  batch_size: 10
  flush_interval_ms: 500

# =============================================================================
# TIMING
# =============================================================================
hls_metadata_head_start_seconds: 10
